name: Deploy static frontend to GitHub Pages

# Builds the static (`output: export`) frontend and publishes it to GitHub
# Pages. The frontend talks to a separately-deployed proxy backend (this same
# app running in dynamic mode on Vercel) via NEXT_PUBLIC_PROXY_BASE.
#
# Required repository variable (Settings → Secrets and variables → Actions →
# Variables):
#   PROXY_BASE  — the backend origin, e.g. https://ct-checker.vercel.app
#
# Also enable Pages with "GitHub Actions" as the source (Settings → Pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress release.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23 # Turbopack/eslint need Node 23 in this project
          cache: npm
      - run: npm ci
      - run: npm run build:static
        env:
          # GitHub Pages serves the project site under /<repo>; basePath must match.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_PROXY_BASE: ${{ vars.PROXY_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
